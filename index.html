<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي - SmartSystem Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }
        .text-size-sm { font-size: 0.75rem; }
        .text-size-md { font-size: 0.875rem; }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 { font-weight: bold; margin-top: 0.5rem; margin-bottom: 0.25rem; }
        .markdown-content ul, .markdown-content ol { padding-right: 1.25rem; margin-top: 0.25rem; margin-bottom: 0.25rem; }
        .markdown-content ul { list-style-type: disc; }
        .markdown-content ol { list-style-type: decimal; }
        .markdown-content p { margin-bottom: 0.5rem; }
        .markdown-content strong { font-weight: bold; }
    </style>
</head>
<body id="app-body" class="flex h-screen overflow-hidden bg-black text-white transition-colors duration-200 text-size-md">

    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>

    <aside id="sidebar" class="w-72 bg-[#121214] border-l border-zinc-800 flex flex-col justify-between p-3 select-none transition-all duration-300 z-30">
        <div>
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2.5">
                    <div class="bg-yellow-500/10 p-1.5 rounded-xl text-yellow-500 text-lg">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-xs">المساعد الذكي</h1>
                        <span class="text-[9px] text-zinc-400 tracking-wider">SMART SYSTEM PRO</span>
                    </div>
                </div>
            </div>

            <div class="space-y-1.5 mb-4">
                <button onclick="clearChat()" class="w-full flex items-center gap-2.5 bg-[#1a1a1e] hover:bg-[#25252a] p-2 rounded-xl text-xs transition cursor-pointer">
                    <i class="fa-solid fa-plus text-[10px]"></i> محادثة جديدة
                </button>
                <button onclick="openApiKeyModal()" class="w-full flex items-center gap-2.5 bg-[#2a2211] hover:bg-[#382e16] text-yellow-400 p-2 rounded-xl text-xs transition cursor-pointer">
                    <i class="fa-solid fa-key"></i> إعدادات المفتاح والنموذج
                </button>
            </div>

            <div>
                <p class="text-[11px] text-zinc-400 mb-1.5 px-1">مواد الصف الخامس الابتدائي</p>
                <div class="space-y-1">
                    <a href="#" onclick="changeSubject('التربية الإسلامية', 'fa-mosque', 'text-emerald-400', event)" class="subject-item flex items-center gap-2.5 bg-zinc-800 text-white p-2 rounded-xl text-xs font-medium transition">
                        <i class="fa-solid fa-mosque text-emerald-400"></i> التربية الإسلامية
                    </a>
                    <a href="#" onclick="changeSubject('قواعد اللغة العربية', 'fa-book', 'text-blue-400', event)" class="subject-item flex items-center gap-2.5 text-zinc-400 hover:bg-zinc-900 p-2 rounded-xl text-xs transition">
                        <i class="fa-solid fa-book text-blue-400"></i> قواعد اللغة العربية
                    </a>
                    <a href="#" onclick="changeSubject('العلوم', 'fa-atom', 'text-cyan-400', event)" class="subject-item flex items-center gap-2.5 text-zinc-400 hover:bg-zinc-900 p-2 rounded-xl text-xs transition">
                        <i class="fa-solid fa-atom text-cyan-400"></i> العلوم
                    </a>
                    <a href="#" onclick="changeSubject('الرياضيات', 'fa-calculator', 'text-rose-400', event)" class="subject-item flex items-center gap-2.5 text-zinc-400 hover:bg-zinc-900 p-2 rounded-xl text-xs transition">
                        <i class="fa-solid fa-calculator text-rose-400"></i> الرياضيات
                    </a>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-between pt-2 border-t border-zinc-800 text-[10px] text-zinc-400">
            <span class="bg-emerald-950 text-emerald-400 px-1.5 py-0.5 rounded-md">مرخص تجارياً</span>
            <span id="active-model-label" class="truncate max-w-[110px]">Gemini 3.8 Flash</span>
        </div>
    </aside>

    <main class="flex-1 flex flex-col justify-between p-4 md:p-6 overflow-hidden relative bg-black">
        <div class="flex items-center justify-between w-full pb-3 border-b border-zinc-800">
            <div id="current-subject-badge" class="bg-[#18181b] border border-zinc-800 px-3 py-1.5 rounded-xl text-xs flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-mosque text-emerald-400 text-xs"></i> <span id="badge-text">التربية الإسلامية</span>
            </div>
            <button onclick="openApiKeyModal()" class="bg-[#2a2211] hover:bg-[#382e16] text-yellow-400 px-2.5 py-1.5 rounded-xl text-xs flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-key"></i> الإعدادات</button>
        </div>

        <div id="chat-container" class="flex-1 overflow-y-auto py-4 space-y-4 px-2"></div>

        <div class="max-w-4xl w-full mx-auto bg-[#18181b] border border-zinc-800 rounded-2xl p-3 relative shadow-2xl mt-1">
            <input id="user-input" type="text" placeholder="اسأل معلم المادة أي سؤال..." class="w-full bg-transparent text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none mb-2 pr-2" onkeydown="if(event.key === 'Enter') sendMessage()">
            <div class="flex items-center justify-between pt-2 border-t border-zinc-800 px-1">
                <span class="text-[10px] text-zinc-500">SmartSystem Pro</span>
                <button onclick="sendMessage()" class="bg-white text-black hover:bg-zinc-200 text-xs font-bold px-4 py-1.5 rounded-xl cursor-pointer">إرسال <i class="fa-solid fa-paper-plane text-[10px]"></i></button>
            </div>
        </div>
    </main>

    <div id="apiKey-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-[#18181b] border border-zinc-800 w-96 rounded-2xl p-5 shadow-2xl">
            <h3 class="text-sm font-bold text-yellow-400 mb-3">إعدادات الاتصال والنيابة</h3>
            <p class="text-[11px] text-zinc-400 mb-2">مفتاح Gemini API:</p>
            <input id="api-key-input" type="password" class="w-full bg-[#111113] border border-zinc-700 rounded-xl p-2.5 text-xs text-zinc-200 focus:outline-none mb-3" placeholder="AIzaSy...">
            
            <div class="flex items-center justify-between mb-2">
                <p class="text-[11px] text-zinc-400">اختر النموذج:</p>
                <button onclick="fetchAvailableModels()" class="text-[10px] text-yellow-400 hover:underline cursor-pointer"><i class="fa-solid fa-rotate"></i> تحديث النماذج تلقائياً</button>
            </div>
            
            <select id="model-selector" class="w-full bg-[#111113] border border-zinc-700 rounded-xl p-2.5 text-xs text-zinc-200 focus:outline-none mb-3 cursor-pointer">
                <option value="gemini-3.8-flash">Gemini 3.8 Flash (الافتراضي)</option>
            </select>

            <button onclick="saveSettings()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black text-xs font-bold py-2 rounded-xl cursor-pointer">حفظ الإعدادات</button>
            <button onclick="closeApiKeyModal()" class="w-full mt-2 bg-zinc-800 text-zinc-300 text-xs py-1.5 rounded-xl cursor-pointer">إلغاء</button>
        </div>
    </div>

    <script>
        let currentSubject = "التربية الإسلامية";
        let chatHistory = JSON.parse(localStorage.getItem('smart_chat_history_v12')) || [];

        window.onload = function() {
            let savedModel = localStorage.getItem('gemini_selected_model') || 'gemini-3.8-flash';
            let savedKey = localStorage.getItem('gemini_api_key');
            
            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
                // جلب النماذج تلقائياً عند فتح الإعدادات إذا كان المفتاح موجوداً
                fetchAvailableModels(false);
            }
            
            document.getElementById('active-model-label.innerText') = savedModel;
            renderChatHistory();
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `${type === 'success' ? 'bg-emerald-600' : 'bg-red-600'} text-white text-xs px-4 py-2 rounded-xl shadow-xl`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function changeSubject(subjectName, iconClass, iconColor, event) {
            event.preventDefault();
            currentSubject = subjectName;
            document.getElementById('badge-text').innerText = subjectName;
            document.querySelector('#current-subject-badge i').className = `fa-solid ${iconClass} ${iconColor} text-xs`;
            renderChatHistory();
        }

        function renderChatHistory() {
            const chatContainer = document.getElementById('chat-container');
            const subjectHistory = chatHistory.filter(item => item.subject === currentSubject);
            chatContainer.innerHTML = subjectHistory.length === 0 ? `<div class="text-center text-zinc-500 my-auto">أهلاً بك في معلم ${currentSubject} الذكي. اسألني أي سؤال!</div>` : '';
            subjectHistory.forEach(chat => {
                chatContainer.innerHTML += `<div class="p-2 bg-zinc-900 rounded-xl my-2 text-xs"><b>س:</b> ${chat.question}<br><b class="text-amber-500">ج:</b> ${marked.parse(chat.answer)}</div>`;
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function clearChat() {
            chatHistory = chatHistory.filter(item => item.subject !== currentSubject);
            localStorage.setItem('smart_chat_history_v12', JSON.stringify(chatHistory));
            renderChatHistory();
        }

        function openApiKeyModal() { document.getElementById('apiKey-modal').classList.remove('hidden'); }
        function closeApiKeyModal() { document.getElementById('apiKey-modal').classList.add('hidden'); }

        // دالة جلب كل النماذج المتاحة ديناميكياً من جوجل
        async function fetchAvailableModels(showAlert = true) {
            const key = document.getElementById('api-key-input').value.trim() || localStorage.getItem('gemini_api_key');
            if (!key) {
                if(showAlert) showToast("الرجاء إدخال مفتاح API أولاً", "error");
                return;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await response.json();
                
                if (data.models) {
                    const selector = document.getElementById('model-selector');
                    const currentSelected = localStorage.getItem('gemini_selected_model') || 'gemini-3.8-flash';
                    selector.innerHTML = '';
                    
                    // تصفية النماذج التي تدعم توليد النصوص (generateContent)
                    const textModels = data.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'));
                    
                    textModels.forEach(model => {
                        // إزالة بادئة "models/" للحصول على اسم النموذج الصافي
                        let modelId = model.name.replace('models/', '');
                        let option = document.createElement('option');
                        option.value = modelId;
                        option.textContent = `${model.displayName || modelId} (${modelId})`;
                        if (modelId === currentSelected) {
                            option.selected = true;
                        }
                        selector.appendChild(option);
                    });
                    
                    if(showAlert) showToast("تم تحديث قائمة النماذج بنجاح من خوادم جوجل!");
                } else {
                    if(showAlert) showToast("فشل جلب النماذج، تأكد من صحة المفتاح", "error");
                }
            } catch (error) {
                if(showAlert) showToast("خطأ في الاتصال بالشبكة", "error");
            }
        }

        function saveSettings() {
            const key = document.getElementById('api-key-input').value.trim();
            const selectedModel = document.getElementById('model-selector').value;
            if(!key) { showToast("الرجاء إدخال المفتاح", "error"); return; }
            localStorage.setItem('gemini_api_key', key);
            localStorage.setItem('gemini_selected_model', selectedModel);
            document.getElementById('active-model-label').innerText = selectedModel;
            closeApiKeyModal();
            showToast("تم حفظ الإعدادات بنجاح!");
        }

        async function sendMessage() {
            const inputEl = document.getElementById('user-input');
            const question = inputEl.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key');
            const activeModel = localStorage.getItem('gemini_selected_model') || 'gemini-3.8-flash';

            if (!apiKey) { openApiKeyModal(); return; }
            if (!question) return;

            inputEl.value = "";
            chatHistory.push({ subject: currentSubject, question, answer: "جاري المعالجة..." });
            renderChatHistory();

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `أنت معلم مادة ${currentSubject} للصف الخامس الابتدائي. أجب بوضوح: ${question}` }] }] })
                });

                const data = await response.json();
                let answerText = data.candidates ? data.candidates[0].content.parts[0].text : (data.error ? data.error.message : "حدث خطأ");
                chatHistory[chatHistory.length - 1].answer = answerText;
                localStorage.setItem('smart_chat_history_v12', JSON.stringify(chatHistory));
                renderChatHistory();
            } catch (e) {
                chatHistory[chatHistory.length - 1].answer = "فشل الاتصال بالخادم.";
                renderChatHistory();
            }
        }
    </script>
</body>
</html>
